          - generic [ref=f55e159]:
            - text: is committed to protecting your privacy and developing technology that gives you the most powerful and safe online experience. This Statement of Privacy applies to the Web site and governs data collection and usage. By using the website, you consent to the data practices described in this statement.
            - heading "Collection of your Personal Information" [level=4] [ref=f55e160]
            - text: "collects personally identifiable information, such as your e-mail address, name, home or work address or telephone number. also collects anonymous demographic information, which is not unique to you, such as your ZIP code, age, gender, preferences, interests and favorites. There is also information about your computer hardware and software that is automatically collected by . This information can include: your IP address, browser type, domain names, access times and referring Web site addresses. This information is used by for the operation of the service, to maintain quality of the service, and to provide general statistics regarding use of the Web site. Please keep in mind that if you directly disclose personally identifiable information or personally sensitive data through public message boards, this information may be collected and used by others. Note: does not read any of your private online communications. encourages you to review the privacy statements of Web sites you choose to link to from so that you can understand how those Web sites collect, use and share your information. is not responsible for the privacy statements or other content on Web sites outside of the and family of Web sites."
            - heading "Use of your Personal Information" [level=4] [ref=f55e161]
            - text: "collects and uses your personal information to operate the Web site and deliver the services you have requested. also uses your personally identifiable information to inform you of other products or services available from and its affiliates. may also contact you via surveys to conduct research about your opinion of current services or of potential new services that may be offered. does not sell, rent or lease its customer lists to third parties. may, from time to time, contact you on behalf of external business partners about a particular offering that may be of interest to you. In those cases, your unique personally identifiable information (e-mail, name, address, telephone number) is not transferred to the third party. In addition, may share data with trusted partners to help us perform statistical analysis, send you email or postal mail, provide customer support, or arrange for deliveries. All such third parties are prohibited from using your personal information except to provide these services to , and they are required to maintain the confidentiality of your information. does not use or disclose sensitive personal information, such as race, religion, or political affiliations, without your explicit consent. keeps track of the Web sites and pages our customers visit within , in order to determine what services are the most popular. This data is used to deliver customized content and advertising within to customers whose behavior indicates that they are interested in a particular subject area. Web sites will disclose your personal information, without notice, only if required to do so by law or in the good faith belief that such action is necessary to: (a) conform to the edicts of the law or comply with legal process served on or the site; (b) protect and defend the rights or property of ; and, (c) act under exigent circumstances to protect the personal safety of users of , or the public."
            - heading "Use of Cookies" [level=4] [ref=f55e162]
            - text: The Web site use "cookies" to help you personalize your online experience. A cookie is a text file that is placed on your hard disk by a Web page server. Cookies cannot be used to run programs or deliver viruses to your computer. Cookies are uniquely assigned to you, and can only be read by a web server in the domain that issued the cookie to you. One of the primary purposes of cookies is to provide a convenience feature to save you time. The purpose of a cookie is to tell the Web server that you have returned to a specific page. For example, if you personalize pages, or register with site or services, a cookie helps to recall your specific information on subsequent visits. This simplifies the process of recording your personal information, such as billing addresses, shipping addresses, and so on. When you return to the same Web site, the information you previously provided can be retrieved, so you can easily use the features that you customized. You have the ability to accept or decline cookies. Most Web browsers automatically accept cookies, but you can usually modify your browser setting to decline cookies if you prefer. If you choose to decline cookies, you may not be able to fully experience the interactive features of the services or Web sites you visit.
            - heading "Security of your Personal Information" [level=4] [ref=f55e163]
            - text: secures your personal information from unauthorized access, use or disclosure. secures the personally identifiable information you provide on computer servers in a controlled, secure environment, protected from unauthorized access, use or disclosure. When personal information (such as a credit card number) is transmitted to other Web sites, it is protected through the use of encryption, such as the Secure Socket Layer (SSL) protocol.
            - heading "Changes to this Statement" [level=4] [ref=f55e164]
            - text: will occasionally update this Statement of Privacy to reflect company and customer feedback. encourages you to periodically review this Statement to be informed of how is protecting your information.
